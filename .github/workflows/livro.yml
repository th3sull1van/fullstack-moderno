# CI do livro: compila o PDF e o EPUB a cada tag (v*) e anexa os artefatos
# à release correspondente. Também permite build manual (workflow_dispatch).
# Requer: TinyTeX com os pacotes listados no README ("Como compilar o livro").
name: livro

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # upload dos artefatos na release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar TinyTeX
        run: |
          wget -qO- "https://yihui.org/tinytex/install-bin-unix.sh" | sh
          echo "$HOME/.TinyTeX/bin/x86_64-linux" >> "$GITHUB_PATH"

      - name: Instalar pacotes TeX (PDF + EPUB)
        run: |
          PKGS="latexmk xetex biber makeindex fontspec babel-portuges microtype \
            xcolor listings tcolorbox fancyhdr titlesec enumitem booktabs tools \
            caption hyperref xurl biblatex etoolbox pgf amsmath amsfonts \
            tex-gyre csquotes colortbl hyph-utf8 tikzfill \
            tex4ebook make4ht luaxml tex4ht luatex"
          # O mirror.ctan.org pode redirecionar para um espelho lento/fora do
          # ar (já travou 10 min no ibiblio). Tenta mirrors diretos em ordem.
          for repo in \
            "https://ctan.math.illinois.edu/systems/texlive/tlnet" \
            "https://mirror.math.princeton.edu/pub/CTAN/systems/texlive/tlnet" \
            "https://mirrors.mit.edu/CTAN/systems/texlive/tlnet" \
            "https://mirror.ctan.org/systems/texlive/tlnet"; do
            echo ">> Tentando repositório: $repo"
            if timeout 420 tlmgr option repository "$repo" \
              && timeout 420 tlmgr install $PKGS; then
              exit 0
            fi
            echo ">> Mirror falhou; tentando o próximo..."
          done
          exit 1

      - name: Reconstruir formato XeLaTeX (hifenização pt-BR)
        run: |
          fmtutil --byengine xelatex || fmtutil-sys --byengine xelatex

      - name: Validação estrutural (sem TeX)
        run: bash scripts/verificar-latex.sh

      - name: Compilar PDF (auto-instala pacotes faltantes)
        run: |
          for i in 1 2 3 4 5 6; do
            # Latexmk cacheia o estado em main.fdb_latexmk e, se a rodada
            # anterior falhou, diz "Nothing to do" sem recompilar. Apagar o
            # estado força recompilação real a cada tentativa.
            rm -f livro/main.fdb_latexmk livro/main.aux livro/main.xdv \
              livro/main.toc livro/main.out livro/main.idx
            if bash scripts/build-pdf.sh; then exit 0; fi
            miss=$(grep -oE "File \`[^']+\.(sty|cls|def|cfg)' not found" \
              livro/main.log 2>/dev/null | sed "s/File \`//;s/' not found//" \
              | sort -u)
            if [ -z "$miss" ]; then
              echo "Falha sem arquivo faltante identificável"; exit 1
            fi
            echo ">> Arquivos faltantes: $miss"
            for f in $miss; do
              # Mapeia o arquivo para o pacote que o contém (nome do arquivo
              # raramente é o nome do pacote: tikzfill.image.sty -> tikzfill).
              # O awk casa só linhas de caminho que terminam exatamente em
              # /$f (evita falsos positivos tipo lwarp-pdfcol.sty para pdfcol).
              pkg=$(tlmgr search --global --file "$f" 2>/dev/null \
                | awk -v f="$f" '/^[a-z0-9._-]+:$/ { pkg=$0; sub(/:$/, "", pkg) } \
                    $0 ~ ("/" f "$") { print pkg; exit }')
              if [ -n "$pkg" ]; then
                echo ">> Instalando pacote '$pkg' (contém $f)"
                tlmgr install "$pkg"
              else
                echo "ERRO: nenhum pacote contém $f"; exit 1
              fi
            done
          done
          exit 1

      - name: Compilar EPUB (auto-instala pacotes faltantes)
        run: |
          for i in 1 2 3 4 5 6; do
            rm -f livro/main.fdb_latexmk livro/main.aux livro/main.xdv \
              livro/main.toc livro/main.out livro/main.idx
            if bash scripts/build-epub.sh; then exit 0; fi
            miss=$(grep -oE "File \`[^']+\.(sty|cls|def|cfg)' not found" \
              livro/epub-build.log 2>/dev/null | sed "s/File \`//;s/' not found//" \
              | sort -u)
            if [ -z "$miss" ]; then
              echo "Falha sem arquivo faltante identificável"; exit 1
            fi
            echo ">> Arquivos faltantes: $miss"
            for f in $miss; do
              pkg=$(tlmgr search --global --file "$f" 2>/dev/null \
                | awk -v f="$f" '/^[a-z0-9._-]+:$/ { pkg=$0; sub(/:$/, "", pkg) } \
                    $0 ~ ("/" f "$") { print pkg; exit }')
              if [ -n "$pkg" ]; then
                echo ">> Instalando pacote '$pkg' (contém $f)"
                tlmgr install "$pkg"
              else
                echo "ERRO: nenhum pacote contém $f"; exit 1
              fi
            done
          done
          exit 1

      - name: Conferir artefatos
        run: |
          ls -la livro/main.pdf livro/main.epub
          # Tamanhos mínimos: PDF do livro ~1 MB, EPUB ~300 KB. Um EPUB de
          # alguns bytes significa conversão falhou silenciosamente.
          test -s livro/main.pdf
          test -s livro/main.epub
          test "$(stat -c%s livro/main.pdf)" -gt 500000
          test "$(stat -c%s livro/main.epub)" -gt 100000

      - name: Anexar artefatos à release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            livro/main.pdf
            livro/main.epub
